name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: python -m pip install -r skills/scientific-ppt-rebuild/requirements.txt
      - name: Test installer and release tools
        run: python -B -X utf8 -m unittest discover -s tests -v
      - name: Test reconstruction runtime and audits
        run: python -B -X utf8 -m unittest discover -s skills/scientific-ppt-rebuild/tests -v
      - name: Regenerate controlled synthetic fixture
        run: python -B -X utf8 examples/synthetic-signal/generate.py
      - name: Check public content and provenance
        run: python -B -X utf8 scripts/check_release.py
      - name: Build release archives
        run: python -B -X utf8 scripts/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/
