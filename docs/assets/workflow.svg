<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Paper-aware draft repair workflow</title>
  <desc id="desc">Source papers and an unverified image-based draft are compared using figure, caption, axes, and formula evidence. Incorrect media is replaced with the original source figure, supported text is corrected, and editable PowerPoint plus a source audit are rendered and reviewed. The included fixture is a controlled illustration, not actual GPT output or a blind benchmark.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#087F83"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="16" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="46" font-size="28" font-weight="700" fill="#20363E">Repair draft slides with original paper figures</text>
    <text x="40" y="78" font-size="17" fill="#5B7076">Use source evidence to replace incorrect visuals, then rebuild editable slide structure.</text>
    <text x="40" y="118" font-size="11" letter-spacing="1.1" font-weight="700" fill="#087F83">01 / SOURCE</text>
    <text x="272" y="118" font-size="11" letter-spacing="1.1" font-weight="700" fill="#AD592C">02 / UNVERIFIED</text>
    <text x="504" y="118" font-size="11" letter-spacing="1.1" font-weight="700" fill="#087F83">03 / MATCH</text>
    <text x="736" y="118" font-size="11" letter-spacing="1.1" font-weight="700" fill="#087F83">04 / REPLACE</text>
    <text x="968" y="118" font-size="11" letter-spacing="1.1" font-weight="700" fill="#087F83">05 / DELIVER</text>
    <rect x="40" y="134" width="192" height="194" rx="11" fill="#F3F8F7" stroke="#D8E4E3"/>
    <text x="56" y="167" font-size="18" font-weight="700" fill="#20363E">Source papers</text>
    <text x="56" y="196" font-size="14" fill="#5B7076">Original figures</text>
    <text x="56" y="217" font-size="14" fill="#5B7076">and definitions</text>
    <path d="M57 239H86L99 252V289H57Z M86 239V252H99 M65 262H91 M65 271H91" fill="#FFFFFF" stroke="#9DBDB5" stroke-width="1.3"/>
    <text x="110" y="261" font-size="12" fill="#5B7076">Figure 1</text>
    <text x="110" y="281" font-size="12" fill="#5B7076">Page 1</text>
    <text x="56" y="311" font-size="9" font-weight="700" letter-spacing=".6" fill="#087F83">SYNTHETIC PAPER</text>
    <path d="M243 230H261" stroke="#087F83" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="272" y="134" width="192" height="194" rx="11" fill="#FCF3EC" stroke="#E5C9B4"/>
    <text x="288" y="167" font-size="18" font-weight="700" fill="#20363E">Unverified draft</text>
    <text x="288" y="196" font-size="14" fill="#AD592C">Image-based input</text>
    <text x="288" y="217" font-size="14" fill="#5B7076">with deliberate errors</text>
    <rect x="288" y="236" width="100" height="54" rx="3" fill="#FFFFFF" stroke="#D5AC90"/>
    <path d="M298 242V282H378 M298 248C324 252 352 257 378 262 M298 262C312 276 337 281 378 282" fill="none" stroke="#AD592C" stroke-width="1.6"/>
    <text x="288" y="311" font-size="9" font-weight="700" letter-spacing=".6" fill="#AD592C">DO NOT TRUST AS EVIDENCE</text>
    <path d="M475 230H493" stroke="#087F83" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="504" y="134" width="192" height="194" rx="11" fill="#FFFFFF" stroke="#A5CBC1" stroke-width="1.5"/>
    <text x="520" y="167" font-size="18" font-weight="700" fill="#20363E">Verify evidence</text>
    <text x="520" y="196" font-size="14" fill="#5B7076">Figure + caption</text>
    <text x="520" y="217" font-size="14" fill="#5B7076">Axes + formula claims</text>
    <rect x="521" y="242" width="10" height="10" fill="#EDF6F5" stroke="#A5CBC1"/>
    <rect x="521" y="265" width="10" height="10" fill="#EDF6F5" stroke="#A5CBC1"/>
    <path d="M541 247H671M541 270H652" stroke="#C7DCD5" stroke-width="3"/>
    <text x="520" y="311" font-size="9" font-weight="700" letter-spacing=".6" fill="#087F83">EXPLICIT SOURCE MAPPING</text>
    <path d="M707 230H725" stroke="#087F83" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="736" y="134" width="192" height="194" rx="11" fill="#FFFFFF" stroke="#A5CBC1" stroke-width="1.5"/>
    <text x="752" y="167" font-size="18" font-weight="700" fill="#20363E">Replace media</text>
    <text x="752" y="196" font-size="14" fill="#5B7076">Original figure bytes</text>
    <text x="752" y="217" font-size="14" fill="#5B7076">Correct supported text</text>
    <rect x="752" y="236" width="100" height="54" rx="3" fill="#FAFCFB" stroke="#A5CBC1"/>
    <path d="M762 242V282H842 M762 245C780 265 800 276 842 280" fill="none" stroke="#087F83" stroke-width="1.8"/>
    <path d="M762 258C789 269 812 274 842 277" fill="none" stroke="#20363E" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="752" y="311" font-size="9" font-weight="700" letter-spacing=".6" fill="#087F83">KEEP THE FIGURE INTACT</text>
    <path d="M939 230H957" stroke="#087F83" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="968" y="134" width="192" height="194" rx="11" fill="#F3F8F7" stroke="#D8E4E3"/>
    <text x="984" y="167" font-size="18" font-weight="700" fill="#20363E">Editable PPTX</text>
    <text x="984" y="196" font-size="14" fill="#5B7076">+ source audit</text>
    <text x="984" y="217" font-size="14" fill="#5B7076">for review and editing</text>
    <rect x="985" y="238" width="54" height="48" rx="4" fill="#FFFFFF" stroke="#A5CBC1"/>
    <text x="1012" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#087F83">PPTX</text>
    <path d="M1054 245H1139M1054 257H1139M1054 269H1124" stroke="#B7D2CA" stroke-width="3"/>
    <text x="984" y="311" font-size="9" font-weight="700" letter-spacing=".6" fill="#087F83">RENDER + COMPARE</text>
    <rect x="40" y="359" width="1120" height="37" rx="6" fill="#FCF3EC"/>
    <circle cx="59" cy="377.5" r="4" fill="#C77644"/>
    <text x="74" y="383" font-size="13.5" fill="#83502F">Controlled illustration of draft errors and source-supported repair. No GPT call or blind benchmark.</text>
  </g>
</svg>
